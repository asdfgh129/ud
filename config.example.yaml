# Universal Downloader · P0 参考配置（对应 docs/13-构建发布与运维.md §7）
# 复制为 config.yaml 后按需修改；优先级：内置默认 < 配置文件 < 环境变量 < CLI 参数 < API 运行时设置。
listen: "127.0.0.1:0"        # 0 = 随机端口 + 本地发现文件；不占用固定 6800
downloadDir: "~/Downloads/ud"
tempSuffix: ".part"
logLevel: "info"             # debug|info|warn|error
# remoteToken 仅在非回环监听时必填；留空且监听回环时无需鉴权。
# 生产环境请通过环境变量 UD_REMOTE_TOKEN 注入，不要写进配置文件。
remoteToken: ""

global:
  maxConcurrentTasks: 5
  maxDownloadRate: "8MiB/s"
  maxUploadRate: "2MiB/s"
  maxConnectionsPerTask: 16
  chunkSize: "4MiB"
  diskFlushInterval: "500ms"

security:
  allowedSchemes: ["http", "https", "ftp", "ftps", "sftp"]
  allowedPorts: [80, 443, 21, 22, 990]
  maxRedirects: 3
  maxMetalinkMirrors: 32
  maxXMLBytes: 4194304
  blockPrivateNetworks: true
  # 仅供本地 fixture / 单元测试使用；开启后允许回环地址与任意端口。生产必须保持 false。
  allowLoopbackForDev: false

# bt.* 已生效（ADR-0021 路径 A，2026-11-14）：由 internal/app/daemon.go 注入
# internal/transport/bt.SeedingPolicy。上传字节速率仍统一由 scheduler.Limiter
# 管理，此处只配置连接槽数；私有种子恒不上传、恒禁 DHT/PEX（BT-08 / 不承诺 PT）。
# peerID 必须保持诚实 -UD 前缀（ADR-0017）：非 -UD 前缀会自动回落生成的诚实 ID。
# seedEnabled=true 时 seedRatio 与 seedTimeMinutes 至少一项 > 0（禁止无界做种）。
# 可用 UD_BT_* 环境变量覆盖，详见 docs/07 配置表与 docs/13 §7。
bt:
  peerID: "-UD0000-"          # 前缀占位；完整 20 字节 -UD ID 才按配置使用
  enableDHT: true
  enablePEX: true
  seedEnabled: true
  seedRatio: 1.0              # 上传/下载达到该分享率即停止做种
  seedTimeMinutes: 60         # 或做种满该时长即停止（任一达标）
  maxUploadSlots: 8           # 同时上传连接数上限
  enableUPnP: true            # UPnP / NAT-PMP 端口映射
  listenPort: 0               # 0 = 随机端口
  listenHost: ""              # 空 = 库默认（所有接口）；生产请配合防火墙
ed2k:
  obfuscation: true
  secureIdent: true
  tcpPort: 4662
  udpPort: 4672
plugins:
  verifySignature: true       # 官方规则包强制 Ed25519 校验；关闭必须同时显式 insecure: true
  runtime: "goja"             # 仅实现 goja；wasm 为未来硬隔离升级路径
  dir: ""                    # 规则通道目录；为空 = 不注册任何插件 Resolver
  trustedKeys: []            # base64 Ed25519 公钥；也可由 UD_PLUGIN_KEYS 提供（逗号分隔）
  insecure: false            # 本地开发跳过签名校验；非回环监听时禁止
  reloadInterval: "30s"      # 热更新轮询间隔（1s..24h）
telemetry:
  enabled: false
